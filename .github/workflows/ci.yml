name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck
        env:
          # The type checker peaks near 2 GB on this codebase; the runner's
          # default heap is smaller than that.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck --workspace=apps/web
