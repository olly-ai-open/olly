name: Build Mac App

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo info
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Top-level files:"
          ls -la
          echo ""
          echo "Root package.json:"
          cat package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm install

      - name: Show available npm scripts
        run: npm run

      - name: Build macOS app
        run: npm run dist:mac

      - name: List dist output
        if: always()
        run: |
          echo "Dist contents:"
          ls -la dist || true
          echo ""
          echo "Recursive dist listing:"
          find dist -maxdepth 3 -print || true

      - name: Upload mac build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olly-mac-build
          path: |
            dist/**
          if-no-files-found: warn