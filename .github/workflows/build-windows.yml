name: Build Windows installer

# Manual only. Run it from the Actions tab of your own fork after adding the
# OLLY_WEB_ENV_LOCAL secret. See docs/desktop-build.md.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # apps/web/.env.local is gitignored. The build needs it to produce the
      # sanitized env bundled into the installer (your Google OAuth client and
      # optional Slack app). Store its contents in the OLLY_WEB_ENV_LOCAL
      # secret. build-packaged-env.js strips LLM keys, encryption and auth
      # secrets, telemetry and hosted-database values; OLLY_STRICT_ENV_CHECK
      # aborts the build if anything forbidden survives.
      - name: Write apps/web/.env.local from secret
        shell: pwsh
        env:
          OLLY_WEB_ENV_LOCAL: ${{ secrets.OLLY_WEB_ENV_LOCAL }}
        run: |
          if (-not $env:OLLY_WEB_ENV_LOCAL) {
            Write-Error "Repo secret OLLY_WEB_ENV_LOCAL is not set. Paste the contents of your apps/web/.env.local into it (Settings > Secrets and variables > Actions). Without it the installer cannot sign in to Google."
            exit 1
          }
          Set-Content -Path apps/web/.env.local -Value $env:OLLY_WEB_ENV_LOCAL -Encoding utf8

      - name: Install dependencies
        run: npm ci

      # Stamp the GitHub run number into the app version (e.g. 1.0.3-build.14)
      # so every CI exe is uniquely identifiable. Local builds are unaffected;
      # the base semver still comes from package.json and is bumped manually.
      - name: Build Windows installer
        shell: pwsh
        run: |
          $base = node -p "require('./package.json').version"
          $stamped = "$base-build.$env:GITHUB_RUN_NUMBER"
          Write-Host "Building version $stamped"
          npm run dist:win -- --config.extraMetadata.version=$stamped
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_TELEMETRY_DISABLED: "1"
          OLLY_STRICT_ENV_CHECK: "1"

      - name: List dist output
        if: always()
        shell: pwsh
        run: Get-ChildItem dist -ErrorAction SilentlyContinue

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: olly-windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
