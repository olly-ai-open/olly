name: Build macOS installers

# Manual by default. Run it from the Actions tab of your own fork after adding
# the OLLY_WEB_ENV_LOCAL secret. See docs/desktop-build.md.
#
# workflow_call lets another workflow in your repo trigger this one, for
# example a private wrapper that builds on every push to a release branch:
#
#   on: { push: { branches: [production] } }
#   permissions: { contents: write }
#   jobs:
#     build:
#       uses: ./.github/workflows/build-mac.yml
#       secrets: inherit
#       with: { release_tag: desktop-latest }
#
# Add release_repo: owner/name (and a RELEASE_REPO_TOKEN secret) to publish
# the installers into another repository, e.g. a public releases-only repo.
#
# By default the installers are stored as a workflow artifact. Pass
# release_tag to attach them to a GitHub release instead: releases do not
# count against the Actions artifact storage quota and are easier to share.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach installers to this GitHub release instead of an artifact (optional)"
        required: false
        type: string
        default: ""
      release_repo:
        description: "Repository that owns the release, as owner/name (optional, defaults to this repo). Needs the RELEASE_REPO_TOKEN secret."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ""
      release_repo:
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # apps/web/.env.local is gitignored. The build needs it to produce the
      # sanitized env bundled into the installer (your Google OAuth client and
      # optional Slack app). Store its contents in the OLLY_WEB_ENV_LOCAL
      # secret. build-packaged-env.js strips LLM keys, encryption and auth
      # secrets, telemetry and hosted-database values; OLLY_STRICT_ENV_CHECK
      # aborts the build if anything forbidden survives.
      - name: Write apps/web/.env.local from secret
        env:
          OLLY_WEB_ENV_LOCAL: ${{ secrets.OLLY_WEB_ENV_LOCAL }}
        run: |
          if [ -z "$OLLY_WEB_ENV_LOCAL" ]; then
            echo "::error::Repo secret OLLY_WEB_ENV_LOCAL is not set. Paste the contents of your apps/web/.env.local into it (Settings > Secrets and variables > Actions). Without it the installer cannot sign in to Google."
            exit 1
          fi
          printf '%s\n' "$OLLY_WEB_ENV_LOCAL" > apps/web/.env.local

      - name: Install dependencies
        run: npm ci

      # npm only installs the embedded Postgres binaries for the runner's own
      # CPU, and treats the other architecture's optional package as already
      # satisfied, so a plain install reports "up to date" and does nothing.
      # The --os and --cpu overrides force each one in. The DMGs must ship
      # both, and the check fails the build if either is missing.
      - name: Install embedded Postgres for both Mac architectures
        run: |
          npm install --no-save --force --os darwin --cpu x64 @embedded-postgres/darwin-x64@17.9.0-beta.17
          npm install --no-save --force --os darwin --cpu arm64 @embedded-postgres/darwin-arm64@17.9.0-beta.17
          node electron/scripts/check-mac-postgres.js

      # Stamp the run number into the app version (e.g. 1.0.3-build.14) so
      # every CI build is uniquely identifiable. Local builds are unaffected.
      - name: Build macOS installers (Intel + Apple Silicon)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_TELEMETRY_DISABLED: "1"
          OLLY_STRICT_ENV_CHECK: "1"
          # No signing identity on a fresh fork: skip code signing entirely.
          # Users must right-click > Open the app on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          base=$(node -p "require('./package.json').version")
          stamped="$base-build.$GITHUB_RUN_NUMBER"
          echo "Building version $stamped"
          npm run dist:mac -- --config.extraMetadata.version="$stamped"

      - name: List dist output
        if: always()
        run: ls -la dist || true

      - name: Publish installers to a GitHub release
        if: inputs.release_tag != ''
        shell: bash
        env:
          # To publish into a different repository (for example a public
          # releases-only repo next to a private source repo), pass
          # release_repo and store a fine-grained token with contents:write
          # on that repo in the RELEASE_REPO_TOKEN secret.
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN || github.token }}
          TAG: ${{ inputs.release_tag }}
          RELEASE_REPO: ${{ inputs.release_repo || github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            # Another platform's job may create it first; that is fine. The
            # commit only exists in this repo, so pin the tag to it only when
            # publishing here.
            notes="Rolling release: assets are replaced on every build. The build number in each file name identifies the run."
            if [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ]; then
              gh release create "$TAG" --repo "$RELEASE_REPO" --target "$GITHUB_SHA" \
                --title "Desktop installers ($TAG)" --prerelease --notes "$notes" || true
            else
              gh release create "$TAG" --repo "$RELEASE_REPO" \
                --title "Desktop installers ($TAG)" --prerelease --notes "$notes" || true
            fi
          fi
          # Keep one set of files per platform: drop this platform's previous assets.
          gh api "repos/$RELEASE_REPO/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | test("\\.(dmg|zip)$")) | .name' \
            | while read -r name; do
                gh release delete-asset "$TAG" "$name" --repo "$RELEASE_REPO" --yes
              done
          # Only the DMGs are published; the zips are the same apps and would
          # double the download list.
          gh release upload "$TAG" dist/*.dmg --repo "$RELEASE_REPO" --clobber

      - name: Upload installers as a workflow artifact
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: olly-mac-installers
          # Installers are large. Keep them long enough to download, not so
          # long that repeated builds fill the repository's artifact storage.
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
