name: Build Olly macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - feature/credential-table
      # later: main, releases/**, etc.

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build macOS app (DMG)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run dist:mac

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: olly-mac-dist
          path: dist/*